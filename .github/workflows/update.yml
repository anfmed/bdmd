name: Update BD Medicine Prices

on:
  schedule:
    # Runs every Friday at 3:00 AM Bangladesh Time (Thursday 21:00 UTC)
    - cron: '0 21 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run MedEx Scraper
        run: python scraper.py

      - name: Commit and Push Updated Dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/medicines.json data/version.json
          if git diff --staged --quiet; then
            echo "No price or medicine changes detected."
          else
            git commit -m "chore: update medicine prices ($(date +'%Y-%m-%d'))"
            git push
          fi
